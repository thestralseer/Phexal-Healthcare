<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <!-- Neutral Grey Card Background -->
  <rect width="600" height="450" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Subtle inner card framing -->
  <rect width="560" height="410" x="20" y="20" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Centered Simple Device / Product Icon -->
  <g transform="translate(300, 180)" stroke="#64748b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Isometric Cube / Equipment Unit -->
    <path d="M 0 -52 L 48 -24 L 48 34 L 0 62 L -48 34 L -48 -24 Z" fill="#f1f5f9"/>
    <path d="M 0 -52 L 0 62"/>
    <path d="M 0 -52 L -48 -24 L 0 4 L 48 -24 Z" fill="#e2e8f0"/>
    <path d="M 0 4 L 48 34"/>
    <path d="M 0 4 L -48 34"/>
  </g>

  <!-- High-Contrast, Bold Text Legible at Small Card Sizes -->
  <text x="300" y="305" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1e293b" letter-spacing="-0.5px">
    Product photo coming soon
  </text>
</svg>
